<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Product Details</title>

<link rel="stylesheet" href="style.css">

<style>
.productDetails{
max-width:1000px;
margin:40px auto;
display:flex;
gap:30px;
padding:20px;
}

.productDetails img{
width:400px;
border-radius:12px;
}

.info{
flex:1;
}

.info h1{
font-size:32px;
margin-bottom:10px;
}

.info h2{
color:#ff6a00;
margin-bottom:15px;
}

.info button{
padding:14px 25px;
margin-right:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.buyBtn{
background:#ff6a00;
color:white;
}

.cartBtn{
background:#2563eb;
color:white;
}
</style>

</head>

<body>

<div id="productContainer"></div>

<script type="module" src="product-details.js"></script>

</body>
</html>
