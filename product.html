<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | AlmariX</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4933930826678291"
     crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    /* ========== PRODUCT SECTION ========== */
    .productDetails {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .productImages {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .productImages img.main {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .thumbs {
      display: flex;
      gap: 12px;
    }

    .thumbs img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: 0.2s;
    }

    .thumbs img:hover,
    .thumbs img.active {
      border-color: #ff6a00;
    }

    .info h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .info .price {
      font-size: 30px;
      font-weight: 700;
      color: #ff6a00;
      margin-bottom: 16px;
    }

    .info .stock {
      display: inline-block;
      background: #dcfce7;
      color: #16a34a;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .info .description {
      color: #475569;
      line-height: 1.7;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .info .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .info button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .cartBtn {
      background: #ff6a00;
      color: white;
    }

    .cartBtn:hover {
      background: #e55a00;
    }

    .buyBtn {
      background: #0f172a;
      color: white;
    }

    .buyBtn:hover {
      background: #1e293b;
    }

    .trust {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #64748b;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    

  <!-- Product will be loaded here by product-details.js -->
  <div id="productContainer"></div>

  <!-- Reviews Section -->
  <section class="reviewsSection" id="reviewsSection" style="display:none;">
    <div class="inner">

      <div class="reviewsHeader">
        <div>
          <h2>Customer Reviews</h2>
          <div class="ratingSummary">
            <span id="averageRating">0.0</span>
            <span class="ratingStars" id="averageStars">☆☆☆☆☆</span>
            <span id="reviewCount">(0 Reviews)</span>
          </div>
        </div>
        <button id="writeReviewBtn">Write a Review</button>
      </div>

      <div id="reviewsList">
        <p>Loading reviews...</p>
      </div>

      <div class="reviewForm" id="reviewForm" style="display:none;">
        <h3>Write a Review</h3>
        <input type="text" id="reviewName" placeholder="Your Name" maxlength="50">
        <select id="reviewRating">
          <option value="5">★★★★★ - 5 Stars</option>
          <option value="4">★★★★☆ - 4 Stars</option>
          <option value="3">★★★☆☆ - 3 Stars</option>
          <option value="2">★★☆☆☆ - 2 Stars</option>
          <option value="1">★☆☆☆☆ - 1 Star</option>
        </select>
        <textarea id="reviewText" placeholder="Write your review..." maxlength="500"></textarea>
        <button id="submitReview">Submit Review</button>
      </div>

    </div>
  </section>

  <script type="module" src="product-details.js"></script>

</body>
</html>
