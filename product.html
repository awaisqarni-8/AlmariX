<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<link rel="stylesheet" href="style.css">

<style>
.productDetails{
max-width:1000px;
margin:40px auto;
display:flex;
gap:30px;
padding:20px;
}

.productDetails img{
width:400px;
border-radius:12px;
}

.info{
flex:1;
}

.info h1{
font-size:32px;
margin-bottom:10px;
}

.info h2{
color:#ff6a00;
margin-bottom:15px;
}

.info button{
padding:14px 25px;
margin-right:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.buyBtn{
background:#ff6a00;
color:white;
}

.cartBtn{
background:#2563eb;
color:white;
}
</style>

</head>

<body>

<div id="productContainer"></div>
<section class="reviewsSection">

  <div class="reviewsHeader">

    <div>
      <h2>Customer Reviews</h2>

      <div class="ratingSummary">

        <span id="averageRating">0.0</span>

        <span class="ratingStars" id="averageStars">
          ☆☆☆☆☆
        </span>

        <span id="reviewCount">
          (0 Reviews)
        </span>

      </div>

    </div>

    <button id="writeReviewBtn">
      Write a Review
    </button>

  </div>


  <div id="reviewsList">
    <p>Loading reviews...</p>
  </div>


  <div
    class="reviewForm"
    id="reviewForm"
    style="display:none;"
  >

    <h3>Write a Review</h3>


    <input
      type="text"
      id="reviewName"
      placeholder="Your Name"
      maxlength="50"
    >


    <select id="reviewRating">

      <option value="5">
        ★★★★★ - 5 Stars
      </option>

      <option value="4">
        ★★★★☆ - 4 Stars
      </option>

      <option value="3">
        ★★★☆☆ - 3 Stars
      </option>

      <option value="2">
        ★★☆☆☆ - 2 Stars
      </option>

      <option value="1">
        ★☆☆☆☆ - 1 Star
      </option>

    </select>


    <textarea
      id="reviewText"
      placeholder="Write your review..."
      maxlength="500"
    ></textarea>


    <button id="submitReview">
      Submit Review
    </button>

  </div>

</section>

<script type="module" src="product-details.js"></script>

</body>
</html>
