<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | AlmariX</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{
background:#f4f6f9;
font-family:Poppins,sans-serif;
}

.checkoutContainer{
max-width:900px;
margin:40px auto;
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.checkoutTitle{
font-size:34px;
font-weight:700;
margin-bottom:25px;
}

.formGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.inputBox input,
.inputBox textarea,
.inputBox select{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

.inputBox textarea{
height:120px;
resize:none;
}

.placeOrderBtn{
width:100%;
margin-top:25px;
padding:16px;
border:none;
border-radius:12px;
background:#22c55e;
color:#fff;
font-size:18px;
font-weight:600;
cursor:pointer;
}
</style>

</head>

<body>

<div class="checkoutContainer">

<h1 class="checkoutTitle">🛒 AlmariX Checkout</h1>

<form id="checkoutForm">

<div class="formGrid">

<div class="inputBox">
<input type="text" id="fullName" placeholder="Full Name" required>
</div>

<div class="inputBox">
<input type="tel" id="phone" placeholder="Phone Number" required>
</div>

<div class="inputBox">
<input type="email" id="email" placeholder="Email Address" required>
</div>

<div class="inputBox">
<input type="text" id="city" placeholder="City" required>
</div>

<div class="inputBox">
<input type="text" id="province" placeholder="Province / State" required>
</div>

<div class="inputBox">
<input type="text" id="zip" placeholder="ZIP / Postal Code">
</div>

<div class="inputBox" style="grid-column:1/-1;">
<textarea id="address" placeholder="Complete Delivery Address" required></textarea>
</div>

<div class="inputBox" style="grid-column:1/-1;">
<select id="paymentMethod">
<option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
</select>
</div>

<div class="inputBox">
<input type="text" id="selectedSize" placeholder="Selected Size" readonly>
</div>

<div class="inputBox">
<input type="text" id="selectedColor" placeholder="Selected Color" readonly>
</div>

</div>

<button type="submit" class="placeOrderBtn">
Place Order
</button>

</form>

</div>
