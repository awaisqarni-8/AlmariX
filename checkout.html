<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6f9;
font-family:'Poppins',sans-serif;
}

.checkoutContainer{

max-width:900px;

margin:40px auto;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.checkoutTitle{

font-size:34px;

font-weight:700;

margin-bottom:25px;

}

.formGrid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:18px;

}

.inputBox input,
.inputBox select,
.inputBox textarea{

width:100%;

padding:15px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:16px;

}

.inputBox textarea{

height:120px;

resize:none;

}

.placeOrderBtn{

width:100%;

margin-top:25px;

padding:16px;

border:none;

border-radius:12px;

background:#22c55e;

color:#fff;

font-size:18px;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="checkoutContainer">

<h1 class="checkoutTitle">🛒 AlmariX Checkout</h1>

<form id="checkoutForm">

<div class="formGrid">

<div class="inputBox">

<input type="text" id="fullName" placeholder="Full Name" required>

</div>

<div class="inputBox">

<input type="tel" id="phone" placeholder="Phone Number" required>

</div>

<div class="inputBox">

<input type="email" id="email" placeholder="Email Address" required>

</div>

<div class="inputBox">

<input type="text" id="city" placeholder="City" required>

</div>
<div class="inputBox">

<input type="text" id="province" placeholder="Province / State" required>

</div>

<div class="inputBox">

<input type="text" id="zip" placeholder="ZIP / Postal Code">

</div>

<div class="inputBox" style="grid-column:1/-1;">

<textarea id="address" placeholder="Complete Delivery Address" required></textarea>

</div>

<div class="inputBox" style="grid-column:1/-1;">

<select id="paymentMethod" required>

<option value="">Select Payment Method</option>

<option>Cash on Delivery (COD)</option>

<option>JazzCash</option>

<option>EasyPaisa</option>

<option>Bank Card</option>

</select>

</div>

</div>

<button type="submit" class="placeOrderBtn">

Place Order

</button>

</form>

</div>
