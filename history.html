<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History | ShopHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f6fa;
font-family:'Poppins',sans-serif;
}

.historyContainer{

max-width:1100px;

margin:40px auto;

background:#fff;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.historyTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.historyItem{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

border-bottom:1px solid #eee;

}

.historyLeft{

display:flex;

align-items:center;

gap:20px;

}

.historyImage{

width:80px;

height:80px;

background:#ddd;

border-radius:12px;

}

.historyInfo h3{

margin-bottom:8px;

}

.historyInfo p{

color:#666;

font-size:15px;

}
