<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">

<title>Shopping Cart | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f7fb;
font-family:'Poppins',sans-serif;
color:#111827;
}

.cartContainer{
max-width:1100px;
margin:50px auto;
padding:30px;
background:#fff;
border-radius:22px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.cartTitle{
font-size:32px;
font-weight:700;
margin:0 0 30px;
}

.cartEmpty{
text-align:center;
padding:70px 20px;
}

.cartEmpty h2{
font-size:25px;
margin-bottom:10px;
}

.cartEmpty p{
color:#6b7280;
margin-bottom:25px;
}

.shopBtn{
display:inline-block;
padding:13px 28px;
border-radius:10px;
background:#ff6a00;
color:white;
text-decoration:none;
font-weight:600;
}

.cartItem{
display:flex;
align-items:center;
justify-content:space-between;
gap:25px;
padding:22px 0;
border-bottom:1px solid #eee;
}

.cartLeft{
display:flex;
align-items:center;
gap:20px;
min-width:0;
}

.cartImage{
width:100px;
height:100px;
object-fit:cover;
border-radius:14px;
background:#f1f1f1;
}

.cartInfo{
min-width:0;
}

.cartInfo h3{
margin:0 0 8px;
font-size:18px;
}

.cartInfo p{
margin:0 0 5px;
color:#ff6a00;
font-weight:700;
}

.cartOption{
font-size:13px;
color:#6b7280;
margin-top:3px;
}

.cartActions{
display:flex;
align-items:center;
gap:10px;
flex-shrink:0;
}

.qtyBtn{
width:36px;
height:36px;
border:none;
border-radius:8px;
background:#ff6a00;
color:#fff;
font-size:20px;
cursor:pointer;
}

.qtyBtn:hover{
opacity:.9;
}

.qty{
min-width:30px;
text-align:center;
font-size:17px;
font-weight:600;
}

.removeBtn{
padding:10px 15px;
border:none;
border-radius:9px;
background:#ef4444;
color:#fff;
cursor:pointer;
font-weight:600;
}

.summary{
margin-top:30px;
padding:22px;
background:#f8fafc;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.summary h2{
margin:0;
font-size:22px;
}

#totalPrice{
color:#ff6a00;
}

.checkoutBtn{
padding:14px 35px;
border:none;
border-radius:11px;
background:#22c55e;
color:#fff;
font-size:17px;
font-weight:600;
cursor:pointer;
}

.checkoutBtn:hover{
opacity:.9;
}

@media(max-width:700px){

.cartContainer{
margin:20px 12px;
padding:20px;
border-radius:16px;
}

.cartTitle{
font-size:26px;
}

.cartItem{
align-items:flex-start;
flex-direction:column;
gap:15px;
}

.cartLeft{
width:100%;
}

.cartImage{
width:80px;
height:80px;
}

.cartActions{
width:100%;
justify-content:flex-end;
}

.summary{
flex-direction:column;
align-items:stretch;
}

.checkoutBtn{
width:100%;
}

}

</style>

</head>

<body>

<div class="cartContainer">

<h1 class="cartTitle">🛒 Shopping Cart</h1>

<div id="cartList"></div>

<div class="summary" id="cartSummary" style="display:none;">

<h2>
Total:
<span id="totalPrice">PKR 0</span>
</h2>

<button class="checkoutBtn" id="checkoutBtn">
Checkout
</button>

</div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const cartList =
document.getElementById("cartList");

const cartSummary =
document.getElementById("cartSummary");

const totalPrice =
document.getElementById("totalPrice");

const checkoutBtn =
document.getElementById("checkoutBtn");


let cart =
JSON.parse(localStorage.getItem("cart")) || [];


function renderCart(){

cartList.innerHTML="";

if(cart.length===0){

cartSummary.style.display="none";

cartList.innerHTML=`

<div class="cartEmpty">

<h2>Your cart is empty</h2>

<p>Add some products to your cart and they will appear here.</p>

<a href="index.html" class="shopBtn">
Continue Shopping
</a>

</div>

`;

return;

}


cartSummary.style.display="flex";


let total=0;


cart.forEach((item,index)=>{

const price =
Number(item.price) || 0;

const qty =
Number(item.qty) || 1;

total += price * qty;


cartList.innerHTML += `

<div class="cartItem">

<div class="cartLeft">

<img
class="cartImage"
src="${item.image || ""}"
alt="${item.name || "Product"}"
>

<div class="cartInfo">

<h3>
${item.name || "Product"}
</h3>

<p>
PKR ${price.toLocaleString()}
</p>

${
item.selectedSize
?
`<div class="cartOption">
Size: ${item.selectedSize}
</div>`
:
""
}

${
item.selectedColor
?
`<div class="cartOption">
Color: ${item.selectedColor}
</div>`
:
""
}

</div>

</div>


<div class="cartActions">

<button
class="qtyBtn"
data-index="${index}"
data-action="minus">
−
</button>

<span class="qty">
${qty}
</span>

<button
class="qtyBtn"
data-index="${index}"
data-action="plus">
+
</button>

<button
class="removeBtn"
data-index="${index}">
Remove
</button>

</div>

</div>

`;

});


totalPrice.innerText =
"PKR " + total.toLocaleString();


}


cartList.addEventListener("click",(e)=>{

const qtyButton =
e.target.closest(".qtyBtn");

const removeButton =
e.target.closest(".removeBtn");


if(qtyButton){

const index =
Number(qtyButton.dataset.index);

const action =
qtyButton.dataset.action;


if(action==="plus"){

cart[index].qty =
(Number(cart[index].qty)||1)+1;

}


if(action==="minus"){

cart[index].qty =
(Number(cart[index].qty)||1)-1;


if(cart[index].qty<=0){

cart.splice(index,1);

}

}


localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}


if(removeButton){

const index =
Number(removeButton.dataset.index);

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

});


checkoutBtn.addEventListener("click",()=>{

if(cart.length===0){

alert("Your cart is empty.");

return;

}

window.location.href="checkout.html";

});


onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});


renderCart();

</script>

</body>
</html>
