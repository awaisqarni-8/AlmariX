<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | ShopHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6f9;
font-family:'Poppins',sans-serif;
}

.cartContainer{

max-width:1100px;

margin:40px auto;

background:#fff;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.cartTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.cartItem{

display:flex;

align-items:center;

justify-content:space-between;

padding:20px;

border-bottom:1px solid #eee;

}

.cartLeft{

display:flex;

align-items:center;

gap:20px;

}

.cartImage{

width:90px;

height:90px;

background:#ddd;

border-radius:12px;

}

.cartInfo h3{

margin-bottom:8px;

}

.cartInfo p{

color:#ff6a00;

font-weight:600;

}
.cartActions{

display:flex;

align-items:center;

gap:12px;

}

.qtyBtn{

width:36px;

height:36px;

border:none;

border-radius:8px;

background:#ff6a00;

color:#fff;

font-size:20px;

cursor:pointer;

}

.qty{

font-size:18px;

font-weight:600;

min-width:30px;

text-align:center;

}

.removeBtn{

padding:10px 16px;

border:none;

border-radius:10px;

background:#ef4444;

color:#fff;

cursor:pointer;

font-weight:600;

}

.summary{

margin-top:30px;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

background:#fafafa;

border-radius:15px;

}

.checkoutBtn{

padding:16px 40px;

border:none;

border-radius:12px;

background:#22c55e;

color:#fff;

font-size:18px;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="cartContainer">

<h1 class="cartTitle">🛒 Shopping Cart</h1>

<div class="cartItem">

<div class="cartLeft">

<div class="cartImage"></div>

<div class="cartInfo">

<h3>Wireless Earbuds</h3>

<p>$29.99</p>

</div>

</div>

<div class="cartActions">

<button class="qtyBtn">-</button>

<span class="qty">1</span>

<button class="qtyBtn">+</button>

<button class="removeBtn">Remove</button>

</div>

</div>

<div class="summary">

<h2>Total: <span id="totalPrice">$29.99</span></h2>

<button class="checkoutBtn">

Checkout

</button>

</div>
