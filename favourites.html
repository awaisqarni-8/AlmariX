<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favourites | ShopHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f6fa;
font-family:'Poppins',sans-serif;
}

.favContainer{

max-width:1100px;

margin:40px auto;

background:#fff;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.favTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.favGrid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

}

.favCard{

background:#fafafa;

padding:18px;

border-radius:16px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.favCard img{

width:100%;

height:180px;

object-fit:cover;

border-radius:12px;

margin-bottom:15px;

}

.favCard h3{

margin-bottom:10px;

}

.favCard p{

color:#ff6a00;

font-weight:700;

margin-bottom:15px;

}
.favBtn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#ff6a00;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

margin-bottom:10px;

}

.removeBtn{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#ef4444;

color:#fff;

font-size:15px;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="favContainer">

<h1 class="favTitle">⭐ Favourite Products</h1>

<div class="favGrid">

<div class="favCard">

<img src="images/product1.png" alt="Product">

<h3>Wireless Earbuds</h3>

<p>$29.99</p>

<button class="favBtn">Add to Cart</button>

<button class="removeBtn">Remove</button>

</div>

<div class="favCard">

<img src="images/product2.png" alt="Product">

<h3>Smart Watch</h3>

<p>$59.99</p>

<button class="favBtn">Add to Cart</button>

<button class="removeBtn">Remove</button>

</div>

</div>
