<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Profile | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{

background:#f4f6f9;

font-family:'Poppins',sans-serif;

}

.profileContainer{

max-width:900px;

margin:40px auto;

background:#fff;

border-radius:20px;

padding:35px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.profileTop{

display:flex;

align-items:center;

gap:25px;

}

.profileImage{

width:120px;

height:120px;

border-radius:50%;

background:#ff6a00;

display:flex;

justify-content:center;

align-items:center;

font-size:55px;

color:#fff;

font-weight:700;

}

.profileInfo h1{

font-size:34px;

margin-bottom:8px;

}

.profileInfo p{

color:#666;

font-size:16px;

}

.profileGrid{

margin-top:40px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}

.profileCard{

background:#fafafa;

padding:22px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.profileCard h3{

margin-bottom:12px;

}
.profileCard p{

font-size:20px;

font-weight:600;

color:#ff6a00;

}

.actionButtons{

margin-top:35px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:18px;

}

.actionButtons button{

padding:15px;

border:none;

border-radius:12px;

background:#ff6a00;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

}

.actionButtons button:hover{

background:#ff8533;

}

</style>

</head>

<body>

<div class="profileContainer">

<div class="profileTop">

<div class="profileImage">

👤

</div>

<div class="profileInfo">

<h1 id="userName">Loading...</h1>

<p id="userEmail">Loading...</p>

</div>

</div>

<div class="profileGrid">

<div class="profileCard">

<h3>Orders</h3>

<p>0</p>

</div>

<div class="profileCard">

<h3>Wishlist</h3>

<p>0</p>

</div>

<div class="profileCard">

<h3>Cart Items</h3>

<p>0</p>

</div>

<div class="profileCard">

<h3>Member</h3>

<p>Premium</p>

</div>

</div>

<div class="actionButtons">

<button onclick="location.href='orders.html'">

My Orders

</button>

<button onclick="location.href='wishlist.html'">

Wishlist

</button>

<button onclick="location.href='cart.html'">

Cart

</button>

<button id="logoutBtn">

Logout

</button>

</div>
</div>

<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

return;

}

document.getElementById("userName").innerText =
user.displayName || "ShopHub User";

document.getElementById("userEmail").innerText =
user.email;

});

document.getElementById("logoutBtn").addEventListener("click",async()=>{

try{

await signOut(auth);

window.location.href="login.html";

}catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
