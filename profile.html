<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | ShopHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{

background:#f4f6f9;

font-family:'Poppins',sans-serif;

}

.profileContainer{

max-width:900px;

margin:40px auto;

background:#fff;

border-radius:20px;

padding:35px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.profileTop{

display:flex;

align-items:center;

gap:25px;

}

.profileImage{

width:120px;

height:120px;

border-radius:50%;

background:#ff6a00;

display:flex;

justify-content:center;

align-items:center;

font-size:55px;

color:#fff;

font-weight:700;

}

.profileInfo h1{

font-size:34px;

margin-bottom:8px;

}

.profileInfo p{

color:#666;

font-size:16px;

}

.profileGrid{

margin-top:40px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}

.profileCard{

background:#fafafa;

padding:22px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.profileCard h3{

margin-bottom:12px;

}
