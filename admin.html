<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | AlmariX</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f5f5f5;
font-family:Poppins,sans-serif;
}

.adminContainer{
max-width:900px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.adminContainer h1{
text-align:center;
margin-bottom:25px;
}

.formBox{
display:flex;
flex-direction:column;
gap:15px;
}

.formBox input,
.formBox textarea,
.formBox select{
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
width:100%;
}

.formBox button{
padding:15px;
background:#ff6a00;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="adminContainer">

<h1>⚙️ AlmariX Admin Panel</h1>

<form id="productForm" class="formBox">

<input type="text" id="productName" placeholder="Product Name" required>

<input type="number" id="productPrice" placeholder="Price (PKR)" required>

<textarea id="productDescription" placeholder="Product Description"></textarea>

<input type="text" id="productImage" placeholder="Image URL">

<button type="submit">
Add Product
</button>

</form>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
