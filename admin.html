<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel | AlmariX</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f5f5f5;
font-family:Poppins,sans-serif;
}

.adminContainer{
max-width:900px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.adminContainer h1{
text-align:center;
margin-bottom:25px;
}

.formBox{
display:flex;
flex-direction:column;
gap:15px;
}

.formBox input,
.formBox textarea,
.formBox select{
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
width:100%;
}

.formBox button{
padding:15px;
background:#ff6a00;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="adminContainer">

<h1>⚙️ AlmariX Admin Panel</h1>

<form id="productForm" class="formBox">

<input type="text" id="productName" placeholder="Product Name" required>

<input type="number" id="productPrice" placeholder="Price (PKR)" required>
<select id="productCategory" required>
<option value="">Select Category</option>
<option value="Men's Fashion">Men's Fashion</option>
<option value="Women's Fashion">Women's Fashion</option>
<option value="Men's Beauty">Men's Beauty</option>
<option value="Women's Beauty">Women's Beauty</option>
<option value="Electronics">Electronics</option>
<option value="Home">Home</option>
<option value="Sports">Sports</option>
<option value="Groceries">Groceries</option>
</select>

<input
type="number"
id="productStock"
placeholder="Stock Quantity"
required>

<div class="inputBox">
<input
type="text"
id="productSize1"
placeholder="Size 1 (Optional) e.g. S">
</div>

<div class="inputBox">
<input
type="text"
id="productSize2"
placeholder="Size 2 (Optional) e.g. M">
</div>

<div class="inputBox">
<input
type="text"
id="productSize3"
placeholder="Size 3 (Optional) e.g. L">
</div>

<div class="inputBox">
<input
type="text"
id="productColor1"
placeholder="Color 1 (Optional) e.g. Black">
</div>

<div class="inputBox">
<input
type="text"
id="productColor2"
placeholder="Color 2 (Optional) e.g. White">
</div>

<div class="inputBox">
<input
type="text"
id="productImage"
placeholder="Image URL 1"
required>
</div>


<div class="inputBox">
<input
type="text"
id="productImage"
placeholder="Image URL 1"
required>
</div>

<div class="inputBox">
<input
type="text"
id="productImage2"
placeholder="Image URL 2 (Optional)">
</div> 

<textarea id="productDescription" placeholder="Product Description"></textarea>

<button type="submit">
Add Product
</button>

</form>
<h2>Products List</h2>

<div id="productList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
