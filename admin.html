<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#eef2f7;
font-family:'Poppins',sans-serif;
}

.adminContainer{

max-width:1200px;

margin:40px auto;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.adminTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.dashboard{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:35px;

}

.card{

background:#2563eb;

color:#fff;

padding:25px;

border-radius:16px;

text-align:center;

}

.card h2{

font-size:36px;

margin-bottom:10px;

}

.card p{

font-size:17px;

}

.formBox{

background:#fafafa;

padding:25px;

border-radius:16px;

}

.formBox h2{

margin-bottom:20px;

}

.inputBox{

margin-bottom:15px;

}

.inputBox input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

outline:none;

font-size:16px;

}
</style>

</head>

<body>

<div class="adminContainer">

<h1 class="adminTitle">⚙️ Admin Dashboard</h1>

<div class="dashboard">

<div class="card">

<h2>120</h2>

<p>Total Products</p>

</div>

<div class="card">

<h2>58</h2>

<p>Total Orders</p>

</div>

<div class="card">

<h2>35</h2>

<p>Users</p>

</div>

<div class="card">

<h2>$8,450</h2>

<p>Total Sales</p>

</div>

</div>

<div class="formBox">

<h2>Add New Product</h2>

<form id="productForm">

<div class="inputBox">

<input type="text" id="productName" placeholder="Product Name" required>

</div>

<div class="inputBox">

<input type="text" id="productPrice" placeholder="Product Price" required>

</div>
</table>

<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

return;

}

});

document.getElementById("productForm").addEventListener("submit",(e)=>{

e.preventDefault();

alert("✅ Product Added Successfully!");

document.getElementById("productForm").reset();

});

<script type="module" src="admin.js"></script>

</div>

</body>

</html>
