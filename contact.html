<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | ShopHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{

background:#f4f6f9;

font-family:'Poppins',sans-serif;

}

.contactContainer{

max-width:900px;

margin:40px auto;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.contactTitle{

font-size:34px;

font-weight:700;

margin-bottom:10px;

}

.contactText{

color:#666;

margin-bottom:30px;

}

.inputBox{

margin-bottom:20px;

}

.inputBox input,
.inputBox textarea{

width:100%;

padding:16px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:16px;

}

.inputBox textarea{

height:180px;

resize:none;

}
.sendBtn{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:#ff6a00;

color:#fff;

font-size:18px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.sendBtn:hover{

background:#ff8533;

}

.contactInfo{

margin-top:30px;

padding:20px;

background:#fafafa;

border-radius:15px;

line-height:32px;

}

.contactInfo h3{

margin-bottom:10px;

}

</style>

</head>

<body>

<div class="contactContainer">

<h1 class="contactTitle">📩 Contact Us</h1>

<p class="contactText">

We'd love to hear from you. Send us your message below.

</p>

<form id="contactForm">

<div class="inputBox">

<input type="text" id="name" placeholder="Your Name" required>

</div>

<div class="inputBox">

<input type="email" id="email" placeholder="Your Email" required>

</div>

<div class="inputBox">

<textarea id="message" placeholder="Write your message..." required></textarea>

</div>

<button type="submit" class="sendBtn">

Send Message

</button>

</form>

<div class="contactInfo">

<h3>Contact Information</h3>

<p>📧 Email: <strong>almarixofficial@gmail.com</strong></p>

<p>🕒 Support: Monday - Sunday (24/7)</p>

</div>
<script>

document.getElementById("contactForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const message=document.getElementById("message").value;

try{

await fetch("https://formsubmit.co/ajax/almarixofficial@gmail.com",{

method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify({
name:name,
email:email,
message:message
})

});

alert("✅ Your message has been sent successfully.");

document.getElementById("contactForm").reset();

}catch(error){

alert("❌ Failed to send message. Please try again.");

}

});

</script>

</body>

</html>
