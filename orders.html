<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>My Orders | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f6fa;
font-family:'Poppins',sans-serif;
}

.ordersContainer{

max-width:1100px;

margin:40px auto;

background:#fff;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.ordersTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.orderCard{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

border:1px solid #eee;

border-radius:16px;

margin-bottom:20px;

}

.orderLeft{

display:flex;

align-items:center;

gap:20px;

}

.orderImage{

width:90px;

height:90px;

background:#ddd;

border-radius:12px;

}

.orderInfo h3{

margin-bottom:8px;

}

.orderInfo p{

color:#666;

font-size:15px;

}
.status{

padding:8px 16px;

border-radius:20px;

font-size:14px;

font-weight:600;

color:#fff;

}

.delivered{

background:#22c55e;

}

.processing{

background:#f59e0b;

}

.cancelled{

background:#ef4444;

}

.orderBtn{

margin-top:10px;

padding:12px 20px;

border:none;

border-radius:10px;

background:#2563eb;

color:#fff;

font-size:15px;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="ordersContainer">

<h1 class="ordersTitle">📦 My Orders</h1>

<div class="orderCard">

<div class="orderLeft">

<div class="orderImage"></div>

<div class="orderInfo">

<h3>Wireless Earbuds</h3>

<p>Order #SH100001</p>

<p>Price: $29.99</p>

</div>

</div>

<div>

<span class="status delivered">Delivered</span><br>

<button class="orderBtn">View Details</button>

</div>

</div>

<div class="orderCard">

<div class="orderLeft">

<div class="orderImage"></div>

<div class="orderInfo">

<h3>Smart Watch</h3>

<p>Order #SH100002</p>

<p>Price: $59.99</p>

</div>

</div>

<div>

<span class="status processing">Processing</span><br>

<button class="orderBtn">Track Order</button>

</div>

</div>
</div>

<script type="module">

import { auth } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});

document.querySelectorAll(".orderBtn").forEach((btn)=>{

btn.addEventListener("click",()=>{

alert("Order details feature will be available soon.");

});

});

</script>

</body>

</html>
