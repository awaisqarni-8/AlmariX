<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist | AlmariX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f4f6f9;
font-family:'Poppins',sans-serif;
}

.wishlistContainer{

max-width:1100px;

margin:40px auto;

background:#fff;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}

.wishlistTitle{

font-size:34px;

font-weight:700;

margin-bottom:30px;

}

.wishlistGrid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(230px,1fr));

gap:25px;

}

.wishCard{

background:#fafafa;

border-radius:18px;

padding:18px;

text-align:center;

box-shadow:0 6px 18px rgba(0,0,0,.08);

}

.wishCard img{

width:100%;

height:180px;

object-fit:cover;

border-radius:12px;

margin-bottom:15px;

}

.wishCard h3{

margin-bottom:10px;

}

.wishCard p{

color:#ff6a00;

font-weight:700;

margin-bottom:15px;

}
.wishBtn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#ff6a00;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

margin-bottom:10px;

}

.removeWish{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#ef4444;

color:#fff;

font-size:15px;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="wishlistContainer">

<h1 class="wishlistTitle">❤️ My Wishlist</h1>

<div class="wishlistGrid">

<div class="wishCard">

<img src="images/product1.png" alt="Product">

<h3>Wireless Earbuds</h3>

<p>$29.99</p>

<button class="wishBtn">Add to Cart</button>

<button class="removeWish">Remove</button>

</div>

<div class="wishCard">

<img src="images/product2.png" alt="Product">

<h3>Smart Watch</h3>

<p>$59.99</p>

<button class="wishBtn">Add to Cart</button>

<button class="removeWish">Remove</button>

</div>

</div>
</div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});

document.querySelectorAll(".wishBtn").forEach((btn)=>{

btn.addEventListener("click",()=>{

alert("Product added to Cart.");

});

});

document.querySelectorAll(".removeWish").forEach((btn)=>{

btn.addEventListener("click",()=>{

btn.closest(".wishCard").remove();

});

});

</script>

</body>

</html>
